name: Construire Transcripteur.exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]          # un tag v1.0.0 publie une Release
  workflow_dispatch:

permissions:
  contents: write          # necessaire pour creer la Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      # Sur un tag v1.2.3, la version est embarquee dans l'exe : c'est elle
      # que l'application compare a la derniere release publiee. Sur une
      # branche, on ecrit "dev" et la mise a jour reste desactivee.
      - name: Inscrire le numéro de version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          Set-Content -Path version.txt -Value $v -NoNewline -Encoding utf8
          "Version embarquée : $v"

      - name: Construire l'exécutable
        run: |
          pyinstaller --noconfirm --clean --onedir --console `
            --add-data "version.txt;." `
            --name Transcripteur `
            --add-data "ui;ui" `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --collect-all tokenizers `
            --collect-all onnxruntime `
            --collect-all huggingface_hub `
            --collect-submodules waitress `
            --hidden-import waitress `
            --hidden-import flask `
            --exclude-module torch `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module scipy `
            app.py

      - name: Test de fumée (démarrage, upload, Range, arrêt)
        run: python tests/smoke_exe.py
        env:
          PYTHONIOENCODING: utf-8

      # Meme si le test de fumee echoue, on veut connaitre le poids et garder
      # la sortie de l'exe : c'est ce qui permet de diagnostiquer.
      - name: Mesurer le poids du livrable
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Transcripteur)) { "Pas de dossier dist."; exit 0 }
          $brut = (Get-ChildItem -Recurse dist/Transcripteur | Measure-Object -Property Length -Sum).Sum
          Compress-Archive -Path dist/Transcripteur -DestinationPath Transcripteur-windows.zip -CompressionLevel Optimal
          $zip = (Get-Item Transcripteur-windows.zip).Length
          "Dossier decompresse : {0:N0} Mo" -f ($brut / 1MB)
          "Zip a telecharger   : {0:N0} Mo" -f ($zip / 1MB)
          "## Poids du livrable`n`n| | Taille |`n|---|---|`n| Zip à télécharger | $([math]::Round($zip/1MB)) Mo |`n| Une fois décompressé | $([math]::Round($brut/1MB)) Mo |`n" >> $env:GITHUB_STEP_SUMMARY
          # Les 25 plus gros fichiers, pour savoir quoi alleger
          Get-ChildItem -Recurse dist/Transcripteur -File |
            Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { "{0,8:N1} Mo  {1}" -f ($_.Length/1MB), $_.FullName.Replace("$PWD\dist\Transcripteur\","") }

      - name: Publier les traces de diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic
          path: |
            sortie-exe.log
            build/Transcripteur/warn-Transcripteur.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier le dossier livrable (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Transcripteur-windows
          path: dist/Transcripteur/
          if-no-files-found: ignore
          retention-days: 30

      # Sur un tag v*, publie le zip en Release : c'est le lien unique et
      # permanent a donner aux utilisateurs.
      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Transcripteur-windows.zip
          name: Transcripteur ${{ github.ref_name }}
          body: |
            ## Installation

            1. Télécharge **Transcripteur-windows.zip** ci-dessous.
            2. Fais un clic droit sur le zip > **Extraire tout**.
            3. Ouvre le dossier extrait et double-clique sur **Transcripteur.exe**.

            Si Windows affiche « Windows a protégé votre ordinateur » :
            **Informations complémentaires** > **Exécuter quand même**.
            Le programme n'est pas signé numériquement, c'est normal.

            Au premier lancement seulement, le modèle de transcription se
            télécharge (145 Mo pour « Rapide », 480 Mo pour « Équilibré »).
            Ensuite l'application fonctionne entièrement hors ligne.
